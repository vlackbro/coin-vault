<body>
<header><div class="bar"><h1>Coin Vault</h1><div class="right"><button class="gear" data-a="menu">⚙ Settings</button><div class="purse"><span id="tk">0</span><small>tokens</small><span class="delta" id="delta"></span></div></div></div>

<script>
const R=[{id:"common",n:"Common",w:60,v:1},{id:"uncommon",n:"Uncommon",w:25,v:4},{id:"rare",n:"Rare",w:10,v:20},{id:"epic",n:"Epic",w:3.5,v:100},{id:"legendary",n:"Legendary",w:1.2,v:500},{id:"mythic",n:"Mythic",w:.3,v:2500}];

const COL=["#8c8279","#3f8f6b","#2f6fd0","#8a4fd1","#e08a12","#d63a5c"],FT=["","#7b8a98","#d14fb0","#7a5cf0","#c98a0a"],FFL=["","#e6eef5","#ff9be8","#a68cff","#ffffff"];

const THEMES=["auto","light","dark","midnight","cherry","sakura","ocean","neon","forest","royal","lava","arctic","desert","galaxy"];
const C=[["Copper Penny",0,"●"],["Tin Farthing",0,"◐"],["Brass Button",0,"◉"],["Iron Washer",0,"○"],["Lead Slug",0,"▪"],
["Silver Dime",1,"◈"],["Bronze Disc",1,"◆"],["Nickel Chip",1,"▣"],["Pewter Mark",1,"✢"],
["Gold Doubloon",2,"☼"],["Jade Piece",2,"❖"],["Amber Mark",2,"✦"],["Cobalt Florin",2,"✚"],
["Ruby Crown",3,"♛"],["Sapphire Seal",3,"✪"],["Emerald Sigil",3,"❂"],
["Phoenix Coin",4,"☀"],["Dragon Scale Coin",4,"❋"],["Eclipse Coin",5,"☾"],["Starforged Coin",5,"✹"],["Wooden Token",0,"◌"],["Clay Chit",0,"▫"],["Rusty Rivet",0,"⊙"],["Pebble Mark",0,"∘"],["Copper Crest",1,"❈"],["Steel Rivet",1,"⬢"],["Quartz Chip",1,"◇"],["Moss Agate",1,"❉"],["Ivory Piece",1,"❃"],["Opal Mark",2,"✧"],["Topaz Florin",2,"⬡"],["Onyx Seal",2,"◙"],["Garnet Bit",2,"✺"],["Lapis Crown",2,"♜"],["Amethyst Seal",3,"✥"],["Diamond Sigil",3,"◊"],["Moonstone Crown",3,"♕"],["Tourmaline Mark",3,"✷"],["Griffin Coin",4,"✵"],["Kraken Coin",4,"✶"],["Unicorn Coin",4,"✿"],["Nebula Coin",5,"✸"],["Worldbreaker Coin",5,"☄"],["Aether Coin",5,"❂"]].map((c,i)=>({i,n:c[0],r:c[1],g:c[2]}));
const ORD=["pow","sell","luck","speed","reveal","auto","heat","echo","appr","rebate"];
const UP={pow:{n:"Bigger mint",max:4,b:100,g:2.4,d:l=>`Mint ${l+2} coins per press. Now ${l+1}.`},
sell:{n:"Haggler",max:5,b:300,g:2.2,d:l=>`Every level adds 15% to sell prices. Now +${l*15}%.`},
luck:{n:"Lucky strike",max:5,b:900,g:2.3,d:l=>`Rarer coins and finishes turn up more often. Now +${l*30}% / +${l*25}%.`},
speed:{n:"Quick hands",max:2,b:3000,g:3,d:l=>`Shorter recharge between mints. Now ${CD[l]} seconds.`},
reveal:{n:"Swift reveal",max:5,b:6000,g:2.2,d:l=>`Coin reveals play faster. Now ${Math.round((1-RM[l])*100)}% quicker.`},
auto:{n:"Auto-minter",max:5,b:15000,g:2.4,d:l=>l?`Mints ${l} coin${l>1?"s":""} by itself every 5 seconds.`:"Mints coins by itself every 5 seconds."},
heat:{n:"Hot forge",max:5,b:30000,g:2.3,d:l=>`The Forge target gets wider. Now +${l*4}% success.`},
echo:{n:"Echo mint",max:5,b:60000,g:2.4,d:l=>`Each minted coin has a ${l*4}% chance to duplicate. Now ${l*4}%.`},
appr:{n:"Appraiser",max:5,b:120000,g:2.4,d:l=>`Rare and better coins sell for more. Now +${l*8}%.`},
rebate:{n:"Rebate",max:5,b:250000,g:2.4,d:l=>`Minting costs less. Now −${l*5}%.`}};
const fresh=()=>({tk:30,inv:{},found:{},mints:0,trades:0,kept:{},wl:0,relics:{},seen:{},ess:0,pres:0,pt:{},ach:{},streak:0,day:"",peak:0,name:"Player"+(1000+Math.floor(Math.random()*9000)),snd:true,notes:true,theme:"auto",up:{pow:0,sell:0,luck:0,speed:0,reveal:0,auto:0,heat:0,guild:0,echo:0,appr:0,rebate:0}});
let S=fresh(),tab="mint",last=[],busy=false,cdEnd=0,cdTot=1,tok=0,revN=0,AC,autoT=0,menu=false,armReset=false,armSell=false,armImp=false,armPre=false,prevTk=0,blob="";
let DB=null,ME=null,mk=[],netState="connecting",done=new Set(),mf={k:"",p:"",q:"1",sort:"new"};
function load(s){S={...fresh(),...s,up:{...fresh().up,...(s.up||{})}};if(S.theme==="sunset")S.theme="cherry";ORD.forEach(k=>S.up[k]=Math.min(S.up[k]|0,UP[k].max));S.tk=Math.max(0,+S.tk||0)}
try{let raw=localStorage.getItem("coinvault3"),s=raw?JSON.parse(raw):null;
if(!s){const o=JSON.parse(localStorage.getItem("coinvault2")||"null");if(o){const m=h=>Object.fromEntries(Object.entries(h||{}).map(([k,v])=>[k+"_0",v]));s={...o,tk:o.gold,inv:m(o.inv),found:m(o.found)}}}
if(s)load(s)}catch(e){}
prevTk=S.tk;
const save=()=>{chk();try{localStorage.setItem("coinvault3",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString(),sl=ms=>new Promise(r=>setTimeout(r,ms)),key=(i,f)=>i+"_"+f;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pt=k=>S.pt[k]|0,lk=()=>S.up.luck+1.5*pt("fort")+wb();const cost=k=>Math.round(UP[k].b*Math.pow(UP[k].g,S.up[k])),price=(r,f)=>Math.max(1,Math.round(R[r].v*F[f].m*(1+.15*S.up.sell)*(1+.4*pt("midas"))*(r>=2?1+.08*S.up.appr:1)));
const mc=()=>mcost(np()),isFree=()=>false,turns=c=>c.rel?5:Math.min(6,TR[c.r]+TF[c.f|0]);
const kc=k=>{const[i,f]=k.split("_").map(Number);return {...C[i],f}},okKey=k=>/^\d+_[0-4]$/.test(k)&&!!C[+k.split("_")[0]]&&C[+k.split("_")[0]].r>=0;
const open=k=>{const i=ORD.indexOf(k);return i===0||S.up[ORD[i-1]]>=Math.min(3,UP[ORD[i-1]].max)},score=c=>c.r+c.f*1.5,fname=c=>(c.f&&!c.rel?F[c.f].n+" ":"")+c.n;
function odds(){const w=R.map((r,i)=>r.w*(i?1+lk()*.3*i:1)),t=w.reduce((a,b)=>a+b);return w.map(x=>x/t)}
function fOdds(){const w=F.map((f,i)=>i?f.w*(1+lk()*.25):f.w),t=w.reduce((a,b)=>a+b);return w.map(x=>x/t)}
function roll(){const left=REL.map((_,i)=>i).filter(i=>!S.relics[i]);if(left.length&&Math.random()<.0006*(1+.6*pt("seek"))*(1+lk()*.04)/(1+Object.keys(S.relics).length*.5)){const i=left[Math.floor(Math.random()*left.length)],r=REL[i];return {rel:true,ri:i,i:"x"+i,n:r[0],g:r[1],col:r[2],r:5,f:4}}const o=odds();let x=Math.random(),r=0;for(;r<5&&x>=o[r];r++)x-=o[r];const p=C.filter(c=>c.r===r),o2=fOdds();let y=Math.random(),f=0;for(;f<4&&y>=o2[f];f++)y-=o2[f];return {...p[Math.floor(Math.random()*p.length)],f}}
function mint(n){const out=[];for(let i=0;i<n;i++){const c=roll(),k=key(c.i,c.f);if(c.rel){c.isNew=true;S.relics[c.ri]=1;S.seen[c.ri]=1;toast(allRel()?"All relics gathered! Prestige at the Altar":"A relic! See the Altar");out.push(c);continue}c.isNew=!S.found[k];S.inv[k]=(S.inv[k]||0)+1;S.found[k]=(S.found[k]||0)+1;if(Math.random()<.04*S.up.echo){S.inv[k]++;S.found[k]++;toast("Echo! A coin duplicated")}out.push(c)}S.mints+=n;return out}
function entries(){return Object.keys(S.inv).filter(k=>S.inv[k]>0).map(k=>({k,n:S.inv[k],c:kc(k)})).sort((a,b)=>score(b.c)-score(a.c))}
function tone(f,d=.12,t="sine",v=.05,dl=0){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+dl;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a);g.gain.exponentialRampToValueAtTime(.0001,a+d);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+d)}catch(e){}}
function toast(m,neg){if(!S.notes)return;const e=document.createElement("div");e.className="toast"+(neg?" neg":"");e.textContent=m;$("toasts").appendChild(e);setTimeout(()=>e.remove(),2600)}
function coin(c,s=84){return c.rel?`<div class="coin relic shiny" style="--s:${s}px;--c:${c.col}">${c.g}</div>`:`<div class="coin r-${R[c.r].id} f${c.f|0}${c.r>=2||c.f>0?" shiny":""}" style="--s:${s}px">${c.g}</div>`}
function theme(){const r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.dataset.theme=S.theme}
function setGold(){const g=$("tk"),t=fmt(S.tk),d=S.tk-prevTk;if(g.textContent!==t){g.textContent=t;g.classList.remove("bump");void g.offsetWidth;g.classList.add("bump")}
if(d){const e=$("delta");e.className="delta";void e.offsetWidth;e.textContent=(d>0?"+":"−")+fmt(Math.abs(d));e.className="delta "+(d>0?"pos":"neg")}prevTk=S.tk}
function render(){if(tab==="trade"&&S.up.sell<UP.sell.max)tab="mint";if((tab==="forge"&&S.up.luck<UP.luck.max)||(tab==="well"&&!allUp()))tab="mint";setGold();
const tu=S.up.sell>=UP.sell.max,T=[["mint","Mint"],["inv","Inventory"],["up","Upgrades"],["forge",S.up.luck>=UP.luck.max?"Forge":"🔒 Forge"],["trade",tu?"Market":"🔒 Market"],["well",allUp()?"Well":"🔒 Well"],["book","Collector’s book"],["goals","Goals"+(dailyOk()?" •":"")]];if(hasRel())T.push(["altar","Altar"+(allRel()?" ⚠":"")]);
$("tabs").innerHTML=T.map(t=>`<button role="tab" aria-selected="${tab===t[0]}" data-t="${t[0]}">${t[1]}</button>`).join("");
$("main").innerHTML=({mint:vMint,inv:vInv,forge:vForge,well:vWell,trade:vTrade,up:vUp,book:vBook,goals:vGoals,altar:vAltar})[tab]();
if(tab==="mint"){buildStage(last,busy?revN:last.length,busy);updBtn()}
if(tab==="trade")drawList()}
function vMint(){const o=odds(),o2=fOdds(),p=x=>(x*100).toFixed(x<.01?2:1)+"%";
return `<div class="tray" id="tray"><div class="stage" id="stage"></div></div>
<div class="mintbox"><button class="mint" id="mintBtn" data-a="mint" aria-label="Mint coins"><span class="face2"><b id="mlab"></b><small id="msub"></small></span></button><p class="hint" id="mhint"></p></div>
<div class="odds">${R.map((r,i)=>`<span class="tag r-${r.id}">${r.n} ${p(o[i])}</span>`).join("")}</div>
<div class="odds">${F.slice(1).map((f,i)=>`<span class="tag" style="--c:${FT[i+1]}">${f.n} ${p(o2[i+1])} · ×${f.m} value</span>`).join("")}</div>`}
function buildStage(cs,upTo,re){$("stage").innerHTML=cs.length?cs.map((c,k)=>`<div class="slot r-${R[c.r].id} f${c.f}${k<upTo?" flip":re?(k===upTo?" charge2":" charge1"):""}" id="s${k}" style="--t:${turns(c)}"><div class="aura"></div><div class="persp"><div class="flipper"><div class="face"><div class="coin myst" style="--s:96px">?</div></div><div class="face front">${coin(c,96)}</div></div></div><div class="cap"><b>${fname(c)}</b><br><span class="tag">${c.rel?"Relic":R[c.r].n}</span>${c.isNew?` <span class="new">New!</span>`:""}</div></div>`).join(""):`<p class="empty">The tray is empty. Mint your first coins.</p>`}
function updBtn(){chkBroke();const b=$("mintBtn");if(!b)return;const rem=cdEnd-Date.now(),n=np(),fr=isFree(),ok=S.tk>=mc()||fr;let l,s,pct=0,dis=true;
if(busy){l="Minting";s="Revealing…"}else if(rem>0){l="Wait";s=(rem/1000).toFixed(1)+"s";pct=(1-rem/cdTot)*100}else if(!ok){l="Need";s=`${mc()} tokens`}else{l="Mint";s=`${n} coin${n>1?"s":""} · ${fr?"free":mc()+" tokens"}`;dis=false}
b.disabled=dis;$("mlab").textContent=l;$("msub").textContent=s;$("mhint").textContent=`${fmt(S.mints)} coins minted · Space to mint`}
function fx(el,c){const r=c.r,f=c.f,n=Math.max([0,5,12,20,32,48][r],[0,16,26,40,70][f]);
for(let i=0;i<Math.min(n,34);i++){const p=document.createElement("i"),a=Math.random()*6.28,d=50+Math.random()*(60+r*22+f*15);p.className="p";
p.style.cssText=`--pc:${f===2||f===4?`hsl(${Math.random()*360} 95% 65%)`:f===1?"#e8eef3":COL[r]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;el.appendChild(p);setTimeout(()=>p.remove(),1000)}
const t=$("tray");if(t&&(r>=3||f>0)){t.style.setProperty("--fc",f?FFL[f]:COL[r]);t.classList.add("flash");if(r>=4||f>=3)t.classList.add("quake");setTimeout(()=>t.classList.remove("flash","quake"),900)}}
function chime(c){for(let i=0;i<=c.r+c.f;i++)tone(520*Math.pow(1.26,i),.3,"triangle",.05,i*.08);if(c.f)for(let i=0;i<c.f*2;i++)tone(1400+i*180,.18,"sine",.03,.3+i*.06)}
async function reveal(cs,my){const live=()=>my===tok,el=k=>$("s"+k),m=RM[S.up.reveal];
await sl(350*m);if(!live())return;
cs.forEach((c,k)=>el(k)&&el(k).classList.add("charge1"));
for(let i=0;i<4;i++){tone(180+i*30,.06,"square",.025);await sl(220*m);if(!live())return}
for(let k=0;k<cs.length;k++){const c=cs[k];let e=el(k);if(e){e.classList.remove("charge1");e.classList.add("charge2")}
const steps=Math.max(2,Math.round((CH[c.r]+FX[c.f])*m/160));
for(let i=0;i<steps;i++){tone(220+i*(18+c.r*6+c.f*8),.07,"square",.03);e=el(k);if(e&&(c.r>=2||c.f>0)&&i===Math.floor(steps*.55))e.classList.add("tell");await sl(160);if(!live())return}
revN=k+1;e=el(k);if(e){e.classList.remove("charge2","tell");e.classList.add("flip","done");fx(e,c)}
chime(c);for(let i=0;i<turns(c);i++)tone(700+i*90,.05,"triangle",.025,i*.2);
await sl(((c.r>=3||c.f>0?1100:600)+turns(c)*210)*m);if(!live())return}
busy=false;updBtn()}
// Coins are already in the inventory when minting starts; leaving the tab just completes the show instantly.
function finishReveal(){if(!busy)return;tok++;revN=last.length;busy=false;save()}
function startMint(){if(busy||Date.now()<cdEnd)return;const fr=isFree();if(!fr&&S.tk<mc()){toast(`Minting costs ${mc()} tokens. Sell some coins first.`,true);return}
if(!fr){S.tk-=mc();toast(`−${mc()} tokens · minting`,true)}tone(300,.08,"square",.03);setGold();
